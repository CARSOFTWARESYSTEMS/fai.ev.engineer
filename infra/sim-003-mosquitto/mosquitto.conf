# SIM-003 local Mosquitto broker — loopback-only, POC development profile.
#
# Security posture (documented in known-limitations / threat model):
#   - listener bound to 127.0.0.1 only — never 0.0.0.0
#   - anonymous access disabled; password-file authentication required
#   - least-privilege ACLs scoped to the demo organisation topic namespace
#   - no WebSocket listener (browser must never connect directly to Mosquitto)
#   - persistence disabled (ephemeral POC telemetry)
#   - no retained messages expected (enforced at the publisher, not here)
#
# Plaintext MQTT on loopback is acceptable for this local POC only. Any
# non-loopback or customer deployment MUST add TLS, certificate validation,
# and customer-specific ACLs — see infra/sim-003-mosquitto/README.md.

listener 1883 127.0.0.1
protocol mqtt

allow_anonymous false
password_file local/passwd
acl_file local/acl

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice

max_connections 50
message_size_limit 65536
