[project]
name = "sim-003-mqtt"
version = "0.1.0"
description = "SIM-003 MQTT Telemetry Simulator for the Battery Trust Platform (FAI.EV.ENGINEER) — synthetic, educational-only."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "aiomqtt>=2.3,<3.0",
  "firebase-admin>=6.5,<7.0",
  "sse-starlette>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "httpx>=0.27,<1.0",
]
streamlit = [
  "streamlit>=1.35,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running local Mosquitto broker (see tests/integration)",
]

[tool.coverage.run]
source = ["src/sim_003"]
